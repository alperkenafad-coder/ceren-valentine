<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine Surprise</title>
  <style>
    :root{
      --bg1:#1a0f24;
      --bg2:#2a1233;
      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);
      --muted2: rgba(255,255,255,0.55);
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:auto;
      margin:0;
      padding:0;
      overflow-x:hidden;
      overflow-y:auto; /* mobil scroll */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1100px 600px at 50% 0%, rgba(255,120,200,0.22), transparent 60%),
                  radial-gradient(900px 500px at 10% 15%, rgba(120,150,255,0.18), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .page{
      min-height: 100dvh; /* iOS için daha doğru */
      padding: 18px 14px 28px;
      display:flex;
      justify-content:center;
    }

    .wrap{
      width: min(920px, 100%);
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .header{
      text-align:center;
      font-size: clamp(18px, 2.4vw, 22px);
      line-height:1.25;
      color: var(--muted);
      padding: 6px 4px 0;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .stage{
      position:relative;
      padding: 16px;
      border-radius: var(--radius);
      min-height: 280px;
      background: radial-gradient(650px 260px at 50% 20%, rgba(255,255,255,0.06), transparent 60%);
    }

    /* mobilde stage daha kısa, ama içerik aşağıda scroll olur */
    @media (max-width: 520px){
      .stage{ min-height: 240px; padding: 14px; }
    }

    .stageInner{
      position:relative;
      height: 100%;
      min-height: inherit;
      border: 2px dashed rgba(255,255,255,0.14);
      border-radius: calc(var(--radius) - 6px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 10px;
    }

    .question{
      position:absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      text-align:center;
      font-size: clamp(18px, 3.6vw, 28px);
      font-weight: 720;
      letter-spacing: 0.2px;
      text-shadow: 0 8px 22px rgba(0,0,0,0.35);
      pointer-events:none;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      user-select:none;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      color: rgba(255,255,255,0.92);
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:active{ transform: translateY(0px) scale(0.98); }

    .btnYes{
      background: rgba(40,180,120,0.20);
      border-color: rgba(40,180,120,0.40);
    }
    .btnNo{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.20);
    }

    /* Butonlar stage içinde absolute duracak (kesişmesin diye kontrol kolay) */
    .btnYes, .btnNo{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    /* başlangıçta solda/sağda, arada boşluk */
    .btnYes{ left: calc(50% - 130px); }
    .btnNo { left: calc(50% + 30px); }

    @media (max-width: 520px){
      .btnYes{ left: calc(50% - 120px); }
      .btnNo { left: calc(50% + 20px); }
      .btn{ padding: 12px 16px; font-size: 15px; }
    }

    .hintLyrics{
      text-align:center;
      padding: 8px 10px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      white-space: pre-line;
    }

    .below{
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .noHint{
      text-align:center;
      padding: 4px 10px 0;
      color: var(--muted);
      font-size: 15px;
      min-height: 22px;
    }

    .resultCard{
      padding: 16px;
      background: var(--card2);
      border-top: 1px solid var(--stroke);
    }

    .resultTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .resultText{
      flex: 1 1 320px;
      min-width: 260px;
    }

    .resultTitle{
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 6px 0;
    }

    .resultMain{
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      color: rgba(255,255,255,0.86);
    }

    .sign{
      margin-top: 10px;
      color: var(--muted2);
      font-size: 15px;
    }

    /* Tek foto alanı (senin kırmızı işaretlediğin yer gibi) */
    .resultPhotoBox{
      flex: 0 0 260px;
      width: 260px;
      max-width: 100%;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.20);
      box-shadow: 0 10px 26px rgba(0,0,0,0.25);
      align-self: stretch;
      min-height: 190px;
    }
    @media (max-width: 720px){
      .resultPhotoBox{
        flex: 1 1 100%;
        width: 100%;
        min-height: 210px;
      }
    }

    .resultPhotoBox img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }

    .actions{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btnGhost{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
    }

    /* küçük kalpler */
    .heart{
      position:absolute;
      font-size: 18px;
      pointer-events:none;
      animation: floatUp 900ms ease-out forwards;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35));
    }
    @keyframes floatUp{
      from{ opacity:0; transform: translate(-50%, 10px) scale(0.9); }
      10%{ opacity:1; }
      to{ opacity:0; transform: translate(-50%, -90px) scale(1.1); }
    }

    .hidden{ display:none !important; }
  </style>
</head>

<body>
  <div class="page">
    <div class="wrap">
      <div class="header">Just answer honestly. Totally not a trap. Definitely not.</div>

      <div class="card">
        <div class="stage" id="stage">
          <div class="stageInner" id="stageInner">
            <div class="question">Do you wanna be my Valentine?</div>

            <button class="btn btnYes" id="yesBtn">Yes 💖</button>
            <button class="btn btnNo"  id="noBtn">No 🙈</button>
          </div>
        </div>

        <div class="hintLyrics">
Cause, girl, I was made for you
And, girl, you were made for me
        </div>

        <div class="below">
          <div class="noHint" id="noHint"></div>

          <div class="resultCard hidden" id="resultCard">
            <div class="resultTop">
              <div class="resultText">
                <div class="resultTitle">Yesss! 💘</div>
                <p class="resultMain">Tamam artık sana rahatça “Sevgilim” demeye devam edebileceğim.</p>
                <div class="sign">— Alp</div>

                <div class="actions">
                  <button class="btn btnGhost" id="copyBtn">Mesajı kopyala</button>
                  <button class="btn btnGhost" id="replayBtn">Tekrar oynat</button>
                </div>
              </div>

              <!-- Tek fotoğraf kutusu -->
              <div class="resultPhotoBox">
                <!-- Foto yolu: photos/main.jpeg (veya .jpg yaparsan burada değiştir) -->
                <img id="resultPhotoImg" src="photos/main.jpeg" alt="Photo" />
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const stageInner = document.getElementById("stageInner");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");
  const noHint = document.getElementById("noHint");

  const resultCard = document.getElementById("resultCard");
  const copyBtn = document.getElementById("copyBtn");
  const replayBtn = document.getElementById("replayBtn");

  // No kaçtıkça mesajlar (sıralı, bittiğinde başa sarar)
  const dodgeMessages = [
    "“No” seçeneği biraz utangaç olabilir…",
    "“Bu bir romantik kovalamaca.”",
    "“No kaçıyor ama kalbi burada.”",
    "“Aslında ‘Yes’ demek istiyor olabilir.”",
    "“Bence evren ‘Yes’ diyor.”",
    "“No bile vazgeçmek üzere.”",
    "“Bu kadar kaçış biraz şüpheli 😏”",
    "“No butonu: panic mode.”",
    "“Kaçmak çözüm değil 👀”",
    "“Artık kader devreye girdi 💘”"
  ];

  let dodgeCount = 0;
  let dodgingEnabled = true;

  function clamp(v, min, max){
    return Math.max(min, Math.min(max, v));
  }

  function rectsOverlap(a, b, pad=0){
    return !(
      a.right + pad < b.left ||
      a.left  - pad > b.right ||
      a.bottom + pad < b.top ||
      a.top   - pad > b.bottom
    );
  }

  function setHintByDodge(){
    // sırayla göster, bittiğinde başa sar
    const idx = dodgeCount % dodgeMessages.length;
    noHint.textContent = dodgeMessages[idx];
  }

  function spawnHeart(x, y){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = Math.random() < 0.5 ? "💘" : "💖";
    h.style.left = x + "px";
    h.style.top  = y + "px";
    stageInner.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  function randomPositionAvoidingYes(){
    const innerRect = stageInner.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();
    const noRect = noBtn.getBoundingClientRect();

    const btnW = noRect.width;
    const btnH = noRect.height;

    // stage içi güvenli alan (kenarlardan pay)
    const pad = 12;

    const minX = pad;
    const maxX = innerRect.width - btnW - pad;
    const minY = 56; // üstte soru metni var, biraz aşağıdan başla
    const maxY = innerRect.height - btnH - pad;

    // yes alanını stageInner koordinatlarına çevir
    const yesLocal = {
      left:   yesRect.left - innerRect.left,
      right:  yesRect.right - innerRect.left,
      top:    yesRect.top - innerRect.top,
      bottom: yesRect.bottom - innerRect.top
    };

    // no’nun olası yeni rect’i (local)
    // yes ile çakışmaması için birkaç deneme yap
    for(let i=0; i<40; i++){
      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      const candidate = {
        left: x,
        right: x + btnW,
        top: y,
        bottom: y + btnH
      };

      // yes ile kesişmesin (+ bir miktar buffer)
      if(!rectsOverlap(candidate, yesLocal, 10)){
        return {x, y};
      }
    }

    // çok nadir: bulamazsa yes’ten uzağa “garanti” konum
    return { x: clamp(20, minX, maxX), y: clamp(innerRect.height - btnH - 20, minY, maxY) };
  }

  function moveNoButton(){
    const pos = randomPositionAvoidingYes();
    noBtn.style.left = pos.x + "px";
    noBtn.style.top  = pos.y + "px";
    noBtn.style.transform = "translate(0,0)"; // absolute yerleştirme
  }

  function initButtonPositions(){
    // yes/no başlangıçta yan yana (solda/sağda) gibi duruyor.
    // Ama responsive değişince no absolute local’e geçebilir.
    // Başlangıç konumu yes/no absolute olduğundan CSS zaten ayarlıyor.
    // Yine de no’nun top/transform resetleyelim:
    noBtn.style.top = "50%";
    noBtn.style.transform = "translateY(-50%)";
    noBtn.style.left = getComputedStyle(noBtn).left;
  }

  function showResult(){
    resultCard.classList.remove("hidden");
    dodgingEnabled = false;

    // küçük kalp patlaması
    const innerRect = stageInner.getBoundingClientRect();
    for(let i=0; i<14; i++){
      const x = Math.random() * innerRect.width;
      const y = innerRect.height * 0.55 + Math.random() * 40;
      spawnHeart(x, y);
    }

    // result görünür olunca sayfa scroll edilebilir (mobil)
    // istersen otomatik aşağı kaydır:
    setTimeout(() => resultCard.scrollIntoView({behavior:"smooth", block:"start"}), 120);
  }

  // Yes
  yesBtn.addEventListener("click", () => showResult());

  // No: kaçsın
  function handleNoDodge(){
    if(!dodgingEnabled) return;

    dodgeCount++;
    setHintByDodge();
    moveNoButton();
  }

  // No’ya tıklamaya çalışınca / yaklaşınca kaçır
  noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    handleNoDodge();
  });

  // mobilde hover yok; yine de mouse ile yaklaşınca kaçsın (desktop)
  noBtn.addEventListener("mouseenter", () => handleNoDodge());

  // Stage'e tıklayınca kalp çıkarsın (tatlı detay)
  stageInner.addEventListener("click", (e) => {
    const r = stageInner.getBoundingClientRect();
    spawnHeart(e.clientX - r.left, e.clientY - r.top);
  });

  // Kopyala
  copyBtn.addEventListener("click", async () => {
    const text = `Ceren said YES! 💖`;
    try{
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Kopyalandı ✓";
      setTimeout(() => copyBtn.textContent = "Mesajı kopyala", 1200);
    }catch{
      copyBtn.textContent = "Kopyalanamadı";
      setTimeout(() => copyBtn.textContent = "Mesajı kopyala", 1200);
    }
  });

  // Tekrar
  replayBtn.addEventListener("click", () => location.reload());

  // İlk yükleme
  window.addEventListener("load", () => {
    initButtonPositions();
  });

  // Ekran döndürme/resize sonrası: no butonu garip yerde kalmasın
  window.addEventListener("resize", () => {
    if(dodgingEnabled){
      initButtonPositions();
    }
  });
</script>
</body>
</html>
