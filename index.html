<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine</title>

  <style>
    :root{
      --bgA:#1c0f25;
      --bgB:#2b1234;

      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.07);
      --stroke: rgba(255,255,255,0.14);
      --stroke2: rgba(255,255,255,0.12);

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --muted2: rgba(255,255,255,0.58);

      --shadow: 0 16px 45px rgba(0,0,0,0.35);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }

    /* (1) MOBIL SCROLL FIX: overflow kilidi yok */
    html, body{
      height:auto;
      margin:0;
      padding:0;
      overflow-x:hidden;
      overflow-y:auto;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 50% 0%, rgba(255,120,200,0.22), transparent 60%),
        radial-gradient(900px 500px at 10% 20%, rgba(130,160,255,0.18), transparent 55%),
        linear-gradient(180deg, var(--bgA), var(--bgB));
    }

    .page{
      min-height: 100dvh;
      padding: 18px 14px 28px;
      display:flex;
      justify-content:center;
    }

    .wrap{
      width: min(920px, 100%);
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .topline{
      text-align:center;
      color: var(--muted);
      font-size: 18px;
      line-height:1.2;
      padding-top: 6px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* Eski şablon hissi: stage üstte büyük alan */
    .stage{
      position: relative;
      padding: 18px 18px 14px;
    }

    .stageBox{
      position: relative;
      border: 2px dashed rgba(255,255,255,0.16);
      border-radius: calc(var(--radius) - 6px);
      background: radial-gradient(700px 240px at 50% 20%, rgba(255,255,255,0.06), transparent 62%);
      height: 260px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Mobilde stage daha kısa; scroll zaten var */
    @media (max-width: 520px){
      .stage{ padding: 14px 14px 12px; }
      .stageBox{ height: 220px; }
    }

    .question{
      position:absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      text-align:center;
      font-weight: 800;
      font-size: clamp(20px, 3.8vw, 30px);
      text-shadow: 0 10px 24px rgba(0,0,0,0.35);
      pointer-events:none;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      user-select:none;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 16px;
      color: rgba(255,255,255,0.92);
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25);
      transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:active{ transform: translateY(0) scale(0.98); }

    .btnYes{
      background: rgba(40,180,120,0.20);
      border-color: rgba(40,180,120,0.40);
    }
    .btnNo{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.20);
    }

    /* Eski şablon: Yes ortada, No yanında ama boşluklu */
    .btnYes, .btnNo{
      position:absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .btnYes{ left: 45%; }
    .btnNo { left: 60%; }

    @media (max-width: 520px){
      .btn{ padding: 12px 16px; font-size: 15px; }
      .btnYes{ left: 42%; }
      .btnNo { left: 62%; }
    }

    .lyrics{
      text-align:center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      padding: 10px 14px 0;
      white-space: pre-line;
    }

    .noHint{
      text-align:center;
      color: var(--muted);
      font-size: 15px;
      padding: 6px 14px 12px;
      min-height: 24px;
    }

    .result{
      display:none;
      padding: 14px;
    }

    .resultCard{
      background: var(--card2);
      border: 1px solid var(--stroke2);
      border-radius: var(--radius);
      padding: 16px;
    }

    .resultTop{
      display:flex;
      align-items:flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }

    .resultText{
      flex: 1 1 320px;
      min-width: 260px;
    }

    .resultTitle{
      font-size: 30px;
      font-weight: 900;
      margin: 0 0 6px 0;
    }

    .resultMain{
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      color: rgba(255,255,255,0.86);
    }

    .sign{
      margin-top: 10px;
      color: var(--muted2);
      font-size: 15px;
    }

    /* Foto kutusu (senin kırmızı işaretlediğin alan mantığı) */
    .photoBox{
      flex: 0 0 280px;
      width: 280px;
      max-width: 100%;
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.20);
      box-shadow: 0 10px 26px rgba(0,0,0,0.25);
      min-height: 200px;
      align-self: stretch;
    }
    @media (max-width: 720px){
      .photoBox{
        flex: 1 1 100%;
        width: 100%;
        min-height: 220px;
      }
    }

    .photoBox img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .actions{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btnGhost{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
    }

    /* küçük kalp animasyonu */
    .heart{
      position:absolute;
      font-size: 18px;
      pointer-events:none;
      animation: floatUp 900ms ease-out forwards;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35));
    }
    @keyframes floatUp{
      from{ opacity:0; transform: translate(-50%, 10px) scale(0.9); }
      10%{ opacity:1; }
      to{ opacity:0; transform: translate(-50%, -90px) scale(1.1); }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="wrap">

      <div class="topline">Just answer honestly. Totally not a trap. Definitely not.</div>

      <div class="card">

        <div class="stage" id="stage">
          <div class="stageBox" id="stageBox">
            <div class="question">Do you wanna be my Valentine?</div>

            <button class="btn btnYes" id="yesBtn">Yes 💖</button>
            <button class="btn btnNo"  id="noBtn">No 🙈</button>
          </div>

          <div class="lyrics">
Cause, girl, I was made for you
And, girl, you were made for me
          </div>

          <div class="noHint" id="noHint"></div>
        </div>

        <!-- YES sonrası (eski gibi aşağıda kart) -->
        <div class="result" id="result">
          <div class="resultCard">
            <div class="resultTop">
              <div class="resultText">
                <div class="resultTitle">Yesss! 💘</div>
                <p class="resultMain">Tamam artık sana rahatça “Sevgilim” demeye devam edebileceğim.</p>
                <div class="sign">— Alp</div>

                <div class="actions">
                  <button class="btn btnGhost" id="copyBtn">Mesajı kopyala</button>
                  <button class="btn btnGhost" id="replayBtn">Tekrar oynat</button>
                </div>
              </div>

              <div class="photoBox">
                <!-- Foto yolu: photos/main.jpeg (jpg ise sadece uzantıyı değiştir) -->
                <img id="mainPhoto" src="photos/main.jpeg" alt="photo" />
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

<script>
  const stageBox = document.getElementById("stageBox");
  const yesBtn   = document.getElementById("yesBtn");
  const noBtn    = document.getElementById("noBtn");
  const noHint   = document.getElementById("noHint");

  const result   = document.getElementById("result");
  const copyBtn  = document.getElementById("copyBtn");
  const replayBtn= document.getElementById("replayBtn");

  const dodgeMessages = [
    "“No” seçeneği biraz utangaç olabilir…",
    "“Bu bir romantik kovalamaca.”",
    "“No kaçıyor ama kalbi burada.”",
    "🔹 3 kaçış → Tatlı",
    "“Aslında ‘Yes’ demek istiyor olabilir.”",
    "“Bence evren ‘Yes’ diyor.”",
    "“No bile vazgeçmek üzere.”",
    "🔹 5 kaçış → Komik",
    "“Bu kadar kaçış biraz şüpheli 😏”",
    "“No butonu: panic mode.”",
    "“Kaçmak çözüm değil 👀”",
    "🔹 8 kaçış → Net Mesaj",
    "“Artık kader devreye girdi 💘”"
  ];

  let dodgeCount = 0;
  let dodgingEnabled = true;

  function rectsOverlap(a, b, pad=0){
    return !(
      a.right + pad < b.left ||
      a.left  - pad > b.right ||
      a.bottom + pad < b.top ||
      a.top   - pad > b.bottom
    );
  }

  function spawnHeart(x, y){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = Math.random() < 0.5 ? "💘" : "💖";
    h.style.left = x + "px";
    h.style.top  = y + "px";
    stageBox.appendChild(h);
    setTimeout(() => h.remove(), 1000);
  }

  function setHint(){
    const idx = dodgeCount % dodgeMessages.length;
    noHint.textContent = dodgeMessages[idx];
  }

  // (2) OVERLAP FIX: No yeni konumu Yes ile kesişemez
  function moveNoAvoidingYes(){
    const boxRect = stageBox.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();
    const noRect  = noBtn.getBoundingClientRect();

    const btnW = noRect.width;
    const btnH = noRect.height;

    const pad = 12;
    const minX = pad;
    const maxX = boxRect.width - btnW - pad;
    const minY = 70; // üstte soru var
    const maxY = boxRect.height - btnH - pad;

    // yes rect'i stageBox lokal koordinata çevir
    const yesLocal = {
      left:   yesRect.left - boxRect.left,
      right:  yesRect.right - boxRect.left,
      top:    yesRect.top - boxRect.top,
      bottom: yesRect.bottom - boxRect.top
    };

    for(let i=0; i<50; i++){
      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      const cand = {
        left: x,
        right: x + btnW,
        top: y,
        bottom: y + btnH
      };

      // Yes ile kesişmesin (+buffer)
      if(!rectsOverlap(cand, yesLocal, 12)){
        noBtn.style.left = x + "px";
        noBtn.style.top  = y + "px";
        noBtn.style.transform = "translate(0,0)";
        return;
      }
    }

    // aşırı nadir: bulamazsa yes'ten uzağa sabitle
    noBtn.style.left = (minX) + "px";
    noBtn.style.top  = (maxY) + "px";
    noBtn.style.transform = "translate(0,0)";
  }

  function showResult(){
    result.style.display = "block";
    dodgingEnabled = false;

    // küçük kalpler
    const r = stageBox.getBoundingClientRect();
    for(let i=0; i<12; i++){
      spawnHeart(Math.random()*r.width, r.height*0.62 + Math.random()*30);
    }

    // mobilde görünür olsun diye aşağı kaydır (scroll artık var)
    setTimeout(() => result.scrollIntoView({behavior:"smooth", block:"start"}), 120);
  }

  yesBtn.addEventListener("click", () => showResult());

  function dodge(){
    if(!dodgingEnabled) return;
    dodgeCount++;
    setHint();
    moveNoAvoidingYes();
  }

  noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener("mouseenter", () => dodge());

  stageBox.addEventListener("click", (e) => {
    const r = stageBox.getBoundingClientRect();
    spawnHeart(e.clientX - r.left, e.clientY - r.top);
  });

  copyBtn.addEventListener("click", async () => {
    const text = `Ceren said YES! 💖`;
    try{
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "Kopyalandı ✓";
      setTimeout(() => copyBtn.textContent = "Mesajı kopyala", 1200);
    }catch{
      copyBtn.textContent = "Kopyalanamadı";
      setTimeout(() => copyBtn.textContent = "Mesajı kopyala", 1200);
    }
  });

  replayBtn.addEventListener("click", () => location.reload());

  // İlk yükleme: No/Yes başlangıç konumları CSS’teki gibi kalsın (eski şablon)
  window.addEventListener("load", () => {
    // ilk kaçıştan sonra absolute top/left ile yer değiştiriyoruz.
    // burada bir şey yapmıyoruz.
  });

  // Ekran döndürmede no butonu saçma konumda kalmışsa, bir sonraki kaçışta düzelir.
</script>

</body>
</html>
